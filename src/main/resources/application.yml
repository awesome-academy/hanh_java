# src/main/resources/application.yml
server:
  max-http-request-header-size: 32KB   # tăng từ 8KB lên 32KB để tránh lỗi "Request header is too large"
  tomcat:
    max-http-response-header-size: 32KB

spring:
  profiles:
    active: dev

  application:
    name: psms

  # JPA — ddl-auto sẽ override theo từng profile
  jpa:
    hibernate:
      ddl-auto: validate       # validate: kiểm tra schema khớp entity, không tự tạo/xóa
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false        # tắt OSIV — tránh lazy loading ngoài transaction

  # i18n — đọc messages.properties bằng UTF-8
  messages:
    basename: messages
    encoding: UTF-8

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  # Servlet file upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # Mail — base config (spring.mail.host phải có để Spring Boot tạo JavaMailSender bean)
  # Dev override: application-dev.yml (Mailtrap credentials)
  # Prod override: application-prod.yml (env vars)
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:${MAILTRAP_USER:placeholder}}
    password: ${MAIL_PASSWORD:${MAILTRAP_PASS:placeholder}}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# JWT (secret sẽ override trong từng profile)
jwt:
  expiration: 3600000          # 1 giờ (ms)
  refresh-expiration: 604800000 # 7 ngày (ms)

# Email sender display
email:
  from: ${MAIL_FROM:noreply@psms.gov.vn}
  from-name: "Cổng DVCQG"

# File storage
file:
  upload-dir: uploads          # relative to working dir; override trong prod
  max-size-bytes: 10485760     #10MB
  allowed-extensions:
    - pdf
    - jpg
    - jpeg
    - png
    - docx

# Swagger — bật trên dev, tắt trên prod
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    groups-order: ASC
  group-configs:
    - group: client
      paths-to-match: /api/auth/**, /api/client/**
    - group: admin
      paths-to-match: /api/admin/**
