<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cập nhật trạng thái hồ sơ</title>
</head>
<body>

<div th:replace="~{email/layout :: wrap(~{::body-content}, '#0D3B7C')}">
  <div th:ref="body-content">

    <p style="font-size:15px;margin-bottom:20px;">
      Xin chào <strong th:text="${fullName}">Nguyễn Văn A</strong>,
    </p>
    <p style="font-size:14px;color:#374151;margin-bottom:20px;">
      Trạng thái hồ sơ của bạn vừa được cập nhật.
    </p>

    <div style="background:#EFF6FF;border-left:4px solid #0D3B7C;border-radius:6px;padding:16px 20px;margin:20px 0;">
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #DBEAFE;font-size:14px;">
        <span style="color:#64748B;">Mã hồ sơ</span>
        <span style="font-weight:700;color:#1A2540;" th:text="${applicationCode}">HS-20260428-00001</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #DBEAFE;font-size:14px;">
        <span style="color:#64748B;">Dịch vụ</span>
        <span style="font-weight:600;color:#1A2540;" th:text="${serviceName}">Cấp CCCD</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;">
        <span style="color:#64748B;">Trạng thái mới</span>
        <span style="display:inline-block;background:#DBEAFE;color:#1D4ED8;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;"
              th:text="${newStatusLabel}">Đang xử lý</span>
      </div>
    </div>

    <!-- Ghi chú cán bộ (nếu có) -->
    <div th:if="${hasNotes}"
         style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:6px;padding:12px 16px;margin:16px 0;font-size:14px;">
      <strong style="color:#92400E;display:block;margin-bottom:4px;">Ghi chú từ cán bộ:</strong>
      <span th:text="${notes}"></span>
    </div>

    <p style="font-size:13px;color:#64748B;margin-top:20px;line-height:1.6;">
      Vui lòng đăng nhập cổng dịch vụ công để xem chi tiết và theo dõi tiến trình xử lý hồ sơ.
    </p>

  </div>
</div>

</body>
</html>
